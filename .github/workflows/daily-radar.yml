name: daily-radar
on:
  schedule:
    - cron: "30 2 * * *"     # 08:00 India time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "config/**"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
      - name: Collect, score, alert
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m jobradar
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "job-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add app_data/jobs.parquet data/jobs.duckdb || true
          git diff --cached --quiet || (git commit -m "Daily refresh" && git push)
